
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeno AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d1b;
  color: #eef2ff;
  font-family: Tahoma, Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #101a30;
  border-bottom: 1px solid #26375b;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg,#168cff,#923dff);
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 0 18px #287dff66;
}

header h2 {
  margin: 0;
  font-size: 19px;
}

header small {
  color: #7e91b8;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.welcome {
  text-align: center;
  margin-top: 65px;
}

.core {
  width: 95px;
  height: 95px;
  margin: auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 42px;
  background: radial-gradient(circle,#315cff,#111b43 70%);
  box-shadow: 0 0 35px #315cff88;
}

.welcome h1 {
  font-size: 25px;
}

.welcome p {
  color: #91a1c4;
  font-size: 14px;
  line-height: 2;
}

.message {
  max-width: 85%;
  padding: 13px 15px;
  margin: 12px 0;
  border-radius: 15px;
  line-height: 1.9;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.bot {
  background: #172440;
  border: 1px solid #29416c;
  margin-left: auto;
}

.user {
  background: linear-gradient(135deg,#174c9e,#6335a7);
  margin-right: auto;
}

footer {
  padding: 12px;
  background: #101a30;
  border-top: 1px solid #26375b;
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  border: 1px solid #30446e;
  background: #080f20;
  color: white;
  border-radius: 12px;
  padding: 14px;
  outline: none;
  font-size: 14px;
}

button {
  border: none;
  background: linear-gradient(135deg,#168cff,#813dff);
  color: white;
  padding: 0 18px;
  border-radius: 12px;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}

</style>
</head>

<body>

<header>
  <div class="logo">Z</div>
  <div>
    <h2>Zeno AI</h2>
    <small>نسخه آزمایشی 0.5</small>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="core">✦</div>
    <h1>به Zeno AI خوش آمدی</h1>
    <p>
      دستیار هوشمند فارسی‌زبان تو<br>
      آماده شروع یک گفت‌وگوی تازه است.
    </p>
  </div>
</main>

<footer>
  <input
    id="messageInput"
    type="text"
    placeholder="پیامت رو بنویس..."
    autocomplete="off"
  >
  <button id="sendButton" onclick="sendMessage()">ارسال</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  document.getElementById("welcome")?.remove();

  addMessage(text, "user");
  input.value = "";
  sendButton.disabled = true;

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "زنو در حال فکر کردن است...";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();
    loading.remove();

    if (!response.ok) {
      throw new Error(data.error || "خطا در ارتباط با سرور");
    }

    addMessage(data.reply, "bot");

  } catch (error) {
    loading.remove();
    addMessage(
      "فعلاً اتصال به سرور برقرار نیست. لطفاً بعداً دوباره تلاش کن.",
      "bot"
    );
  }

  sendButton.disabled = false;
  input.focus();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
